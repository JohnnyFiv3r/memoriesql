[build-system]
requires = [
  "setuptools==80.9.0",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "memoriesql"
version = "0.0.2"
description = "Experimental memoriesQL contract catalogs and provider-neutral runtime"
readme = "PYPI_README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "John Inniger"}]
keywords = ["ai", "contracts", "json-schema", "memory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["psycopg[binary]==3.3.3", "pydantic==2.13.3", "pydantic-ai-slim==2.27.0"]

[project.urls]
Homepage = "https://github.com/JohnnyFiv3r/memoriesql"
Repository = "https://github.com/JohnnyFiv3r/memoriesql"
Issues = "https://github.com/JohnnyFiv3r/memoriesql/issues"
Security = "https://github.com/JohnnyFiv3r/memoriesql/security/policy"

[project.scripts]
memoriesql = "memoriesql.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["memoriesql", "memoriesql.contracts", "memoriesql.infrastructure", "memoriesql.infrastructure.postgres", "memoriesql.application", "memoriesql.application.capture", "memoriesql.domain", "memoriesql.infrastructure.jobs", "memoriesql.infrastructure.models"]
include-package-data = false

[tool.setuptools.package-data]
"memoriesql.contracts" = ["_catalogs/*.json"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "scripts", "tests"]
