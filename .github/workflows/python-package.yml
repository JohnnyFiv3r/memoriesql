name: Python package integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify registry, catalogs, API, and boundary
        run: |
          python scripts/generate_catalogs.py --check
          python scripts/verify_public_boundary.py
          python scripts/verify_migration_export.py
          python scripts/verify_runtime_export.py
          python scripts/verify_export_provenance.py
          python -m unittest discover -v
          python -m compileall -q src scripts tests
      - name: Lint and type-check
        run: |
          ruff check src scripts tests
          mypy src scripts tests
      - name: Build and inspect reviewed artifacts
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m build --sdist --wheel --outdir build/dist-a
          python scripts/normalize_python_sdist.py build/dist-a/memoriesql-0.0.2.tar.gz
          python -m twine check --strict build/dist-a/*
          python scripts/inspect_python_distribution.py build/dist-a > build/dist-a/python-package-artifacts.json
          python scripts/verify_release.py artifacts build/dist-a
      - name: Prove deterministic rebuild
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m build --sdist --wheel --outdir build/dist-b
          python scripts/normalize_python_sdist.py build/dist-b/memoriesql-0.0.2.tar.gz
          cmp build/dist-a/memoriesql-0.0.2-py3-none-any.whl build/dist-b/memoriesql-0.0.2-py3-none-any.whl
          cmp build/dist-a/memoriesql-0.0.2.tar.gz build/dist-b/memoriesql-0.0.2.tar.gz
      - name: Retain exact artifacts and inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memoriesql-python-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/dist-a/*
          if-no-files-found: error
          retention-days: 30

  compatibility:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: synthetic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      N1_TEST_DATABASE_URL: postgresql://postgres:synthetic@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-python-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reviewed-package
      - name: Resolve audited runtime dependencies and record artifact hashes
        run: |
          python -m pip download 'psycopg[binary]==3.3.3' 'pydantic==2.13.3' 'pydantic-ai-slim==2.27.0' --only-binary=:all: --dest build/dependencies
          sha256sum build/dependencies/* > build/dependency-hashes.txt
          python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Rebuild wheel independently from the reviewed sdist
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m pip wheel --no-deps --no-build-isolation build/reviewed-package/*.tar.gz --wheel-dir build/from-sdist
          cmp build/reviewed-package/*.whl build/from-sdist/*.whl
      - name: Prove wheel and sdist installations with checkout access denied
        run: |
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          for artifact in build/reviewed-package/*.whl build/from-sdist/*.whl; do
            test_root="$(mktemp -d)"
            python -m venv "$test_root/venv"
            "$test_root/venv/bin/python" -m pip install --no-index --find-links build/dependencies "$artifact"
            cp scripts/run_installed_acceptance.py scripts/prove_package_isolation.py "$test_root/"
            cp contracts/runtime-inventory.json contracts/public-registry.json "$test_root/"
            cp tests/migrations/*.py tests/runtime/*.py tests/unit/test_contract_catalog_preview.py tests/fixtures/*.json "$test_root/"
            (cd "$test_root" && venv/bin/python -I prove_package_isolation.py && venv/bin/python -I run_installed_acceptance.py)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-dependencies-${{ matrix.python-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/dependency-hashes.txt
          if-no-files-found: error

  older-python:
    name: compatibility (${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-python-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidates
      - name: Prove old catalog fallback is not a migration install
        run: |
          python -m pip download --no-deps --only-binary=:all: memoriesql==0.0.1a1 --dest candidates
          python -m pip install --no-index --find-links candidates memoriesql
          python -I -c "import importlib.util; from importlib.metadata import version; assert version('memoriesql') == '0.0.1a1'; assert importlib.util.find_spec('memoriesql.infrastructure') is None"
          if python -m pip install --no-deps candidates/memoriesql-0.0.2-py3-none-any.whl; then
            echo 'Unsupported interpreter incorrectly accepted migration artifact'
            exit 1
          fi
