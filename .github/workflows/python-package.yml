name: Python package integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify registry, catalogs, API, and boundary
        run: |
          python scripts/generate_catalogs.py --check
          python scripts/verify_public_boundary.py
          python -m unittest discover -v
      - name: Lint and type-check
        run: |
          ruff check src scripts tests
          mypy src scripts tests
      - name: Build and inspect reviewed artifacts
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m build --outdir build/dist-a
          python scripts/normalize_python_sdist.py build/dist-a/memoriesql-0.0.1a1.tar.gz
          python -m twine check --strict build/dist-a/*
          python scripts/inspect_python_distribution.py build/dist-a > build/dist-a/python-package-artifacts.json
      - name: Prove deterministic rebuild
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m build --outdir build/dist-b
          python scripts/normalize_python_sdist.py build/dist-b/memoriesql-0.0.1a1.tar.gz
          cmp build/dist-a/memoriesql-0.0.1a1-py3-none-any.whl build/dist-b/memoriesql-0.0.1a1-py3-none-any.whl
          cmp build/dist-a/memoriesql-0.0.1a1.tar.gz build/dist-b/memoriesql-0.0.1a1.tar.gz
      - name: Retain exact artifacts and inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memoriesql-python-${{ github.sha }}
          path: build/dist-a/*
          if-no-files-found: error
          retention-days: 30

  compatibility:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-python-${{ github.sha }}
          path: build/reviewed-package
      - name: Install only the reviewed wheel and prove isolation
        run: |
          python -m pip install --disable-pip-version-check --no-index --no-deps build/reviewed-package/*.whl
          preview_root="$(mktemp -d)"
          cd "$preview_root"
          python -c "from memoriesql.contracts import contract_inventory, iter_contracts; assert len(iter_contracts()) == 49; assert contract_inventory()['compatibility_guarantee'] is False"
          memoriesql contracts --json > contracts.json
          memoriesql contract memoriesql.capture.connector-cursor --json > cursor.json
          python "$GITHUB_WORKSPACE/scripts/prove_package_isolation.py"
