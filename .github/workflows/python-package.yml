name: Python package integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source SHA selected by the coordinator
        required: true
        type: string
      purpose:
        description: Candidate uses standing authority; release requires separate main approval
        type: choice
        options: [candidate, release]
        default: candidate
      owner_approval_ref:
        description: Required only for separately authorized release-main qualification
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    concurrency:
      group: package-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    outputs:
      qualify: ${{ steps.qualification.outputs.qualify }}
      source_sha: ${{ steps.qualification.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select eligible exact-head fictional qualification
        id: qualification
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/select_hosted_qualification.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify registry, catalogs, API, and boundary
        run: |
          python scripts/generate_evidence_package_contract.py --check
          python scripts/generate_logical_unit_contract.py --check
          python scripts/generate_complete_input_contracts.py --check
          python scripts/generate_fold_recovery_contract.py --check
          python scripts/generate_source_revisiting_contract.py --check
          python scripts/generate_source_stable_identity_contract.py --check
          python scripts/generate_declared_scope_contract.py --check
          python scripts/generate_managed_dispatch_contract.py --check
          python scripts/generate_local_mentions_contract.py --check
          python scripts/generate_authored_mentions_contract.py --check
          python scripts/generate_authored_relations_contract.py --check
          python scripts/generate_relation_profile_contract.py --check
          python scripts/generate_bead_classification_contract.py --check
          python scripts/generate_relation_assessment_contract.py --check
          python scripts/generate_assessed_relation_lifecycle_contract.py --check
          python scripts/generate_stored_bead_inspection_contract.py --check
          python scripts/generate_source_enrollment_contract.py --check
          python scripts/generate_local_client_pairing_contract.py --check
          python scripts/generate_personal_local_initialization_contract.py --check
          python scripts/generate_catalogs.py --check
          python scripts/verify_public_boundary.py
          python scripts/verify_migration_export.py
          python scripts/verify_runtime_export.py
          python -m unittest discover -v
          python -m compileall -q src scripts tests
      - name: Lint and type-check
        run: |
          ruff check src scripts tests
          mypy src scripts tests
      - name: Build and inspect reviewed artifacts
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m build --sdist --wheel --outdir build/dist-a
          python scripts/normalize_python_sdist.py build/dist-a/memoriesql-0.0.12.tar.gz
          python -m twine check --strict build/dist-a/*
          # Development receipts never replace the immutable publication inventory.
          python scripts/inspect_python_distribution.py build/dist-a --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" > build/dist-a/python-package-artifacts.json
          python scripts/inspect_python_distribution.py build/dist-a --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" --check-inventory build/dist-a/python-package-artifacts.json > /dev/null
      - name: Prove deterministic rebuild
        run: |
          export SOURCE_DATE_EPOCH=315532800
          python -m build --sdist --wheel --outdir build/dist-b
          python scripts/normalize_python_sdist.py build/dist-b/memoriesql-0.0.12.tar.gz
          cmp build/dist-a/memoriesql-0.0.12-py3-none-any.whl build/dist-b/memoriesql-0.0.12-py3-none-any.whl
          cmp build/dist-a/memoriesql-0.0.12.tar.gz build/dist-b/memoriesql-0.0.12.tar.gz
      - name: Retain exact artifacts and inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memoriesql-python-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/dist-a/*
          if-no-files-found: error
          retention-days: 30

      - name: Retain package admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qualification-request.json
          if-no-files-found: warn
          retention-days: 30

  compatibility:
    if: needs.package.outputs.qualify == 'true'
    needs: package
    name: compatibility (${{ matrix.python-version }}, part ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    concurrency:
      group: qualification-${{ github.run_id }}-${{ matrix.python-version }}-${{ matrix.part }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        # ACCEPTANCE_PARTS in scripts/run_hosted_qualification.py
        part: [1, 2, 3]
        # One hash-pinned actions/python-versions build per interpreter, so every
        # part runs the same interpreter bytes whatever its runner image caches.
        include:
          - python-version: "3.13"
            python-build: "3.13.18"
            python-build-url: https://github.com/actions/python-versions/releases/download/3.13.18-40336726450/python-3.13.18-linux-24.04-x64.tar.gz
            python-build-sha256: 683005a1465d94d40045f6a1a6eb316885b5f08d3360f7922b44ef58a14a9eed
          - python-version: "3.14"
            python-build: "3.14.10"
            python-build-url: https://github.com/actions/python-versions/releases/download/3.14.10-40336797752/python-3.14.10-linux-24.04-x64.tar.gz
            python-build-sha256: d67d217db8480fd474bac19db80f6b956362432cca30ed6ac6fbe5a2bba6b4cd
    services:
      postgres:
        image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: synthetic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      N1_TEST_DATABASE_URL: postgresql://postgres:synthetic@127.0.0.1:5432/postgres
      PYTHONNOUSERSITE: "1"
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      # Image caches differ between runner image releases, and setup-python's own
      # install copies without timestamps and reinstalls pip, so neither gives the
      # parts byte-identical trees. Extract the pinned build where its RUNPATH
      # points, with its compiled files still current; setup-python only activates it.
      - name: Install the pinned CPython build into the tool cache
        id: python-build
        timeout-minutes: 5
        shell: bash
        env:
          PYTHON_MINOR: ${{ matrix.python-version }}
          PYTHON_BUILD: ${{ matrix.python-build }}
          PYTHON_BUILD_URL: ${{ matrix.python-build-url }}
          PYTHON_BUILD_SHA256: ${{ matrix.python-build-sha256 }}
        run: |
          case "$PYTHON_BUILD" in
            "$PYTHON_MINOR".*) ;;
            *) echo "pinned build $PYTHON_BUILD is not Python $PYTHON_MINOR" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/python-$PYTHON_BUILD.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "$PYTHON_BUILD_URL"
          echo "$PYTHON_BUILD_SHA256  $archive" | sha256sum --check --strict
          prefix="$RUNNER_TOOL_CACHE/Python/$PYTHON_BUILD/x64"
          rm -rf "$prefix" "$prefix.complete"
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          # What the build's setup.sh does, without its pip reinstall.
          rm "$prefix/setup.sh"
          ln -s "./bin/python$PYTHON_MINOR" "$prefix/python"
          ln -s "python$PYTHON_MINOR" "$prefix/bin/python${PYTHON_MINOR/./}"
          if [ ! -e "$prefix/bin/python" ]; then
            ln -s "python$PYTHON_MINOR" "$prefix/bin/python"
          fi
          touch "$prefix.complete"
          echo "version=$PYTHON_BUILD" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.python-build.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-python-${{ needs.package.outputs.source_sha }}
          path: build/reviewed-package
      - name: Qualify reviewed installed bytes for one acceptance part
        timeout-minutes: 95
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          PART: ${{ matrix.part }}
          N1_TEST_CLI_IDENTITY_AUTHORITY_SHA256: ${{ vars.N1_TEST_CLI_IDENTITY_AUTHORITY_SHA256 }}
          PROOF_ROOT: ${{ runner.temp }}/qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}-${{ matrix.part }}
        run: |
          unset PYTHONPATH
          mkdir -p build/qualification
          python scripts/run_hosted_qualification.py part --part "$PART" \
            --artifacts build/reviewed-package --evidence build/qualification \
            --root "$PROOF_ROOT" --source-sha "$SOURCE_SHA" \
            2>&1 | tee build/qualification/driver.log
      - name: Retain and stop the exact owned PostgreSQL service
        if: always()
        timeout-minutes: 3
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p build/qualification
          test -n "$POSTGRES_SERVICE_ID"
          failed=0
          docker logs "$POSTGRES_SERVICE_ID" > build/qualification/postgres.log 2>&1 || failed=1
          docker inspect --format '{{.Image}}' "$POSTGRES_SERVICE_ID" > build/qualification/postgres-image-id.txt || failed=1
          docker stop --time 10 "$POSTGRES_SERVICE_ID" > build/qualification/postgres-stop.txt || failed=1
          docker inspect --format '{{json .State}}' "$POSTGRES_SERVICE_ID" > build/qualification/postgres-state.json || failed=1
          python -c 'import json; s=json.load(open("build/qualification/postgres-state.json")); assert s["Running"] is False and s["Pid"] == 0' || failed=1
          echo "$failed" > build/qualification/postgres-cleanup-exit.txt
          test "$failed" -eq 0
      - name: Retain complete part exits and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-qualification-part-${{ matrix.python-version }}-${{ matrix.part }}-${{ needs.package.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/qualification/
            build/reviewed-package/python-package-artifacts.json
          if-no-files-found: error
          retention-days: 30

  qualification:
    # Runs after every part, even failed ones, so a missing or failed part is
    # recorded as an incomplete proof; it runs no tests and owns proof_complete.
    # needs.compatibility.result covers every part of both interpreters, so a
    # failed part of either interpreter also refuses the other's aggregation.
    if: always() && needs.package.outputs.qualify == 'true'
    needs: [package, compatibility]
    name: qualification (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: aggregation-${{ github.run_id }}-${{ matrix.python-version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-python-${{ needs.package.outputs.source_sha }}
          path: build/reviewed-package
      - name: Aggregate every part into this interpreter's proof
        timeout-minutes: 10
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          PARTS_RESULT: ${{ needs.compatibility.result }}
          PYTHON_MINOR: ${{ matrix.python-version }}
          GH_TOKEN: ${{ github.token }}
          AGGREGATION_ROOT: ${{ runner.temp }}/aggregation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
        run: |
          unset PYTHONPATH
          mkdir -p build/qualification
          python scripts/run_hosted_qualification.py aggregate \
            --python-minor "$PYTHON_MINOR" --parts-result "$PARTS_RESULT" \
            --package build/reviewed-package --evidence build/qualification \
            --root "$AGGREGATION_ROOT" --source-sha "$SOURCE_SHA" \
            2>&1 | tee build/qualification/aggregate.log
      - name: Retain the interpreter's aggregated proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-qualification-${{ matrix.python-version }}-${{ needs.package.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qualification/
          if-no-files-found: error
          retention-days: 30
