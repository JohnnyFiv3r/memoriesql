name: Publish approved memoriesQL package

on:
  push:
    tags: ["v0.0.2"]

permissions:
  contents: read

concurrency:
  group: pypi-memoriesql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'JohnnyFiv3r/memoriesql' &&
      github.repository_id == '1357510758' &&
      github.event_name == 'push' && github.ref == 'refs/tags/v0.0.2' &&
      github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Require successful exact-main-head package CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/python-package.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -F per_page=100 > build/ci-runs.json
          python scripts/verify_release.py ci \
            --runs build/ci-runs.json --sha "$GITHUB_SHA" \
            --main-sha "$(git rev-parse origin/main)" --tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-python-${{ github.sha }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: JohnnyFiv3r/memoriesql
          path: build/reviewed-package
      - name: Verify and stage only the inventoried wheel and sdist
        run: python scripts/verify_release.py artifacts build/reviewed-package --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memoriesql-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    if: >-
      github.repository == 'JohnnyFiv3r/memoriesql' &&
      github.repository_id == '1357510758' &&
      github.ref == 'refs/tags/v0.0.2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/memoriesql/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memoriesql-release-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          print-hash: true

